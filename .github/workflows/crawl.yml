name: Crawl Jobs

on:
  workflow_dispatch:
  schedule:
    # Target: Melbourne 00:00, 06:00, 12:00, 18:00 (Australia/Melbourne).
    # GitHub cron is UTC-only, so we use separate AEDT/AEST schedules.
    # Transition weeks (first Sun in Apr/Oct) may be ±1h for a few days.
    #
    # AEDT (UTC+11): Melbourne 00/06/12/18 → UTC 13/19/01/07
    - cron: "0 1,7,13,19 1-3,11-12 *"
    - cron: "0 1,7,13,19 * 4 1-7"
    - cron: "0 1,7,13,19 * 10 8-31"
    # AEST (UTC+10): Melbourne 00/06/12/18 → UTC 14/20/02/08
    - cron: "0 2,8,14,20 * 4 8-30"
    - cron: "0 2,8,14,20 5-9 *"
    - cron: "0 2,8,14,20 * 10 1-7"

jobs:
  crawl:
    runs-on: ubuntu-latest

    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      HEADLESS: "false"
      PLAYWRIGHT_TIMEOUT: "60000"
      CI: "true"

    steps:
      - name: Log workflow trigger
        run: |
          echo "Workflow trigger: ${{ github.event_name }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          echo "Installing Python dependencies..."
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          echo "Installing Playwright Chromium with system dependencies..."
          python -m playwright install --with-deps chromium

      - name: Run application
        run: |
          echo "Starting job crawl pipeline..."
          xvfb-run -a python main.py

      - name: Upload crawler debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-debug-artifacts
          path: artifacts/
          if-no-files-found: ignore
