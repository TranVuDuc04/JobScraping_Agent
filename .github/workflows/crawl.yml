name: Crawl Jobs

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours at 00:00, 06:00, 12:00, and 18:00 UTC.
    # Approx Melbourne (AEST, UTC+10): 10:00, 16:00, 22:00, 04:00
    # Approx Melbourne (AEDT, UTC+11): 11:00, 17:00, 23:00, 05:00
    # GitHub cron always runs in UTC and does not adjust for daylight saving.
    - cron: "0 */6 * * *"

jobs:
  crawl:
    runs-on: ubuntu-latest

    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      HEADLESS: "false"
      PLAYWRIGHT_TIMEOUT: "60000"
      CI: "true"

    steps:
      - name: Log workflow trigger
        run: echo "Workflow trigger: ${{ github.event_name }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          echo "Installing Python dependencies..."
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          echo "Installing Playwright Chromium with system dependencies..."
          python -m playwright install --with-deps chromium

      - name: Run application
        run: |
          echo "Starting job crawl pipeline..."
          xvfb-run -a python main.py

      - name: Upload crawler debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-debug-artifacts
          path: artifacts/
          if-no-files-found: ignore
